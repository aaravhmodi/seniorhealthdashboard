# Keep the backend awake.
#
# Render's free tier stops the process after ~15 minutes without an HTTP
# request, and Fly suspends on the same idea. A stopped process runs no
# scheduler, so nothing time-triggered fires: not the 24-hour follow-up, not
# the escalation timeout that texts the second caregiver when the first has
# gone quiet. Requests still wake it -- a check-in or an inbound Linq webhook
# arrives over HTTP -- so the gap is only ever "nothing happened for a while,
# and then a timer should have".
#
# The app catches up correctly on wake (overdue jobs and escalations fire on
# the first tick), so this ping is not about correctness. It is about how late
# "late" is: every 10 minutes instead of whenever someone next opens the app.
#
# This is a stopgap. The real answer is a tier that does not sleep.
name: keepalive

on:
  schedule:
    # Every 10 minutes. GitHub queues cron on a best-effort basis and can be
    # several minutes late under load, which is fine for this purpose.
    - cron: "*/10 * * * *"
  workflow_dispatch:

# Scheduled workflows are disabled after 60 days without repository activity.
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Wake the API
        # Never fail the workflow: a red X every ten minutes trains everyone to
        # ignore CI, and a missed ping is not worth that.
        run: |
          for url in \
            "https://senior-checkin-api.onrender.com/healthz" ; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 90 "$url" || echo "000")
            echo "$url -> $code"
          done
