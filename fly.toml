# Alternative to Render: `fly launch --no-deploy` then `fly deploy`.
app = "senior-checkin-api"
primary_region = "bos"

[build]
  dockerfile = "backend/Dockerfile"

[env]
  MOCK_MODE = "true"
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0

[[http_service.checks]]
  path = "/healthz"
  interval = "30s"
  timeout = "5s"
