# Alternative to Render: `fly launch --no-deploy` then `fly deploy`.
app = "senior-checkin-api"
primary_region = "bos"

[build]
  dockerfile = "backend/Dockerfile"

[env]
  MOCK_MODE = "true"
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_start_machines = true
  # Do NOT let this sleep. A stopped machine runs no scheduler, so the 24-hour
  # follow-up and the escalation timeout never fire on time -- and an alert
  # that should have escalated to the second caregiver at minute ten instead
  # waits for whoever next opens the app. Requests still wake it either way;
  # keeping one machine up is what makes the timers real.
  auto_stop_machines = "off"
  min_machines_running = 1

[[http_service.checks]]
  path = "/healthz"
  interval = "30s"
  timeout = "5s"
